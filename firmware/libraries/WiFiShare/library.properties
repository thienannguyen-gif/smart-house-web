sentence=Các mạch ESP8266/ESP32 không vào được Wi-Fi thì tự bầu một mạch phát Wi-Fi cài đặt, rồi chia mạng mới cho nhau.
paragraph=Người dùng vào Wi-Fi cài đặt bằng điện thoại, chọn mạng và nhập mật khẩu một lần; mạch chủ thử mạng rồi gửi cho các mạch đang chờ. Mỗi mạch tự vào mạng mới rồi báo về mạch chủ.
